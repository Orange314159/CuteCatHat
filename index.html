        // Strategy: Detect orientation or small window width to force mobile layout
        function checkMobile() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const isNarrow = window.innerWidth <= 1100;
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (isPortrait || isNarrow || isTouch) {
                document.body.classList.add('mobile-layout');
            } else {
                document.body.classList.remove('mobile-layout');
            }
        }
        window.addEventListener('resize', checkMobile);
        checkMobile();
    </script>

    <!-- Modal overlay for enlarged image -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-img-box">
            <button id="closeModalBtn" class="close-modal-btn" title="Close">✖</button>
            <img id="modalImg" src="" alt="">
            <div class="modal-desc" id="modalDesc"></div>
        </div>
    </div>
    <script>
        // Track visit
        fetch('/api/visit', { method: 'POST' }).catch(err => console.error('Visit track failed:', err));

        // Modal logic for enlarged image
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImg = document.getElementById('modalImg');
        const modalDesc = document.getElementById('modalDesc');
        const closeModalBtn = document.getElementById('closeModalBtn');

        document.querySelectorAll('.gallery-item img').forEach(img => {
            img.addEventListener('click', function(e) {
                // Disable popup on mobile-like screens (width <= 900px or portrait/tall aspect)
                const isMobileLike = window.innerWidth <= 900 || window.innerWidth / window.innerHeight < 1;
                if (isMobileLike) return;

                // Track click
                const photoName = this.src.split('/').pop();
                fetch('/api/click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ photoName })
                }).catch(err => console.error('Click track failed:', err));

                // Show modal with enlarged image and description (consider full res photos)
                modalImg.src = this.src.replace(/_resized|-resized/g, '');
                modalImg.alt = this.alt;
                modalDesc.textContent = '';
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                e.stopPropagation();
            });
        });

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Allow closing modal by clicking outside the modal-img-box
        modalOverlay.addEventListener('mousedown', function(e) {
            // Only close if the user clicks directly on the overlay (not inside modal-img-box or comments section)
            if (!e.target.closest('.modal-img-box')) {
            closeModal();
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        if (closeModalBtn) {
            closeModalBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeModal();
            });
        }
    </script>
